<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<title>Checkout Demo</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
  .totalrow { display: flex; justify-content: space-between; padding: 14px 0; font-weight: bold; font-size: 20px; border-top: 2px solid #333; margin-top: 10px; }
  button { margin-top: 20px; padding: 14px 24px; font-size: 16px; background: #111; color: white; border: none; border-radius: 6px; }
</style>
</head>
<body>
  <h2>Din varukorg</h2>
  <div class="row"><span>Klänning, stl M</span><span>599 kr</span></div>
  <div class="row"><span>Frakt</span><span>49 kr</span></div>
  <div class="totalrow"><span>Totalt att betala</span><span>899 kr</span></div>
  <button>Slutför köp</button>
</body>
</html>
